<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cornhole Match Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- APP HEADER & NAVIGATION -->
    <header class="app-header">
        <h1>Cornhole Tracker</h1>
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('setup')">Setup</button>
            <button class="tab-btn" onclick="switchTab('scorekeeping')">Scoring</button>
            <button class="tab-btn" onclick="switchTab('stats')">Stats</button>
        </nav>
    </header>

    <main class="container">

        <!-- TAB 1: MATCH SETUP & ROSTER MANAGEMENT -->
        <div id="tab-setup" class="tab-content active">
            <section class="card">
                <div class="card-header-actions">
                    <h2>Match Setup</h2>
                    <button class="btn btn-secondary btn-sm" onclick="fetchRosterFromSheet()">Sync Roster</button>
                </div>
                
                <div class="form-group">
                    <label for="game-mode">Game Mode</label>
                    <select id="game-mode" onchange="toggleGameMode()">
                        <option value="2v2">2 vs 2 (Doubles)</option>
                        <option value="1v1">1 vs 1 (Singles)</option>
                        <option value="practice">Practice / Solo</option>
                    </select>
                </div>

                <div class="setup-section">
                    <!-- Board 1 Setup -->
                    <div class="board-setup-card">
                        <h3>Board 1</h3>
                        <div class="player-side-inputs">
                            <div class="input-group">
                                <label for="blue-player-1">Board 1 Left (Blue)</label>
                                <select id="blue-player-1" class="player-select">
                                    <option value="">Loading roster...</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="red-player-1">Board 1 Right (Red)</label>
                                <select id="red-player-1" class="player-select">
                                    <option value="">Loading roster...</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Board 2 Setup -->
                    <div class="board-setup-card">
                        <h3>Board 2</h3>
                        <div class="player-side-inputs">
                            <div class="input-group">
                                <label for="red-player-2">Board 2 Left (Red)</label>
                                <select id="red-player-2" class="player-select">
                                    <option value="">Loading roster...</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="blue-player-2">Board 2 Right (Blue)</label>
                                <select id="blue-player-2" class="player-select">
                                    <option value="">Loading roster...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Add New Player to Google Sheet Roster -->
                <div class="add-player-box">
                    <label for="new-player-name">Add Player</label>
                    <div class="input-with-btn">
                        <input type="text" id="new-player-name" placeholder="Enter player name">
                        <button class="btn btn-secondary" onclick="addPlayerToSheet()">Add Player</button>
                    </div>
                </div>

                <button class="btn btn-primary btn-block mt-20" onclick="startMatch()">Start Match</button>
            </section>
        </div>

        <!-- TAB 2: SCOREKEEPING -->
        <div id="tab-scorekeeping" class="tab-content">
            <!-- Scoreboard Banner -->
            <section class="scoreboard">
                <div class="score-box red-bg">
                    <span id="red-score-label" class="team-label">RED</span>
                    <span id="red-total" class="team-score">0</span>
                </div>
                <div class="score-box blue-bg" id="blue-score-box">
                    <span class="team-label">BLUE</span>
                    <span id="blue-total" class="team-score">0</span>
                </div>
            </section>

            <!-- Current Inning Controls -->
            <section class="card">
                <h2>Inning <span id="display-inn-num">1</span> Throw Input</h2>

                <!-- Red Pitcher Inputs -->
                <div class="team-input-section red-border">
                    <h3 id="red-pitcher-label">RED: PLAYER NAME</h3>
                    
                    <div class="selector-row">
                        <label>Board</label>
                        <div id="red-board-boxes" class="btn-box-group"></div>
                    </div>
                    <div class="selector-row">
                        <label>Hole</label>
                        <div id="red-hole-boxes" class="btn-box-group"></div>
                    </div>
                </div>

                <!-- Blue Pitcher Inputs -->
                <div class="team-input-section blue-border" id="blue-team-section">
                    <h3 id="blue-pitcher-label">BLUE: PLAYER NAME</h3>
                    
                    <div class="selector-row">
                        <label>Board</label>
                        <div id="blue-board-boxes" class="btn-box-group"></div>
                    </div>
                    <div class="selector-row">
                        <label>Hole</label>
                        <div id="blue-hole-boxes" class="btn-box-group"></div>
                    </div>
                </div>

                <button id="btnEndInning" class="btn btn-primary btn-block" onclick="submitInning()">Submit Inning</button>
            </section>

            <!-- Inning Log Table -->
            <section class="card">
                <div class="card-header-actions">
                    <h2>Inning Log</h2>
                    <button class="btn btn-success btn-sm" onclick="saveMatchToSheet()">Save Match to Sheets</button>
                </div>
                <div class="table-responsive">
                    <table class="log-table">
                        <thead>
                            <tr>
                                <th>Inn</th>
                                <th>Red Pitcher</th>
                                <th>Red Pts</th>
                                <th class="blue-col">Blue Pitcher</th>
                                <th class="blue-col">Blue Pts</th>
                                <th>Inning Net</th>
                                <th>Match Score</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="log-body">
                            <!-- Inning entries dynamically rendered via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

        <!-- TAB 3: PLAYER STATS -->
        <div id="tab-stats" class="tab-content">
            <section class="card">
                <h2>Match Player Statistics</h2>
                <div id="stats-container" class="stats-container">
                    <!-- Stat cards dynamically rendered via JS -->
                </div>
            </section>
        </div>

    </main>

                    uploadRosterToFirebase();

</body>
</html>
