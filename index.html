<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cornhole Match Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- APP HEADER & NAVIGATION -->
    <header class="app-header">
        <h1>Cornhole Tracker</h1>
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('setup')">Setup</button>
            <button class="tab-btn" onclick="switchTab('scorekeeping')">Scoring</button>
            <button class="tab-btn" onclick="switchTab('stats')">Stats</button>
        </nav>
    </header>

    <main class="container">

        <!-- TAB 1: MATCH SETUP -->
        <div id="tab-setup" class="tab-content active">
            <section class="card">
                <h2>Match Setup</h2>
                
                <div class="form-group">
                    <label for="game-mode">Game Mode</label>
                    <select id="game-mode" onchange="toggleGameMode()">
                        <option value="2v2">2 vs 2 (Doubles)</option>
                        <option value="1v1">1 vs 1 (Singles)</option>
                        <option value="practice">Practice / Solo</option>
                    </select>
                </div>

                <div class="team-setup-grid">
                    <!-- Red Team -->
                    <div class="team-config red-border-left">
                        <h3>Red Team</h3>
                        <div class="form-group">
                            <label for="red-player-1">Player 1 (Pitcher A)</label>
                            <input type="text" id="red-player-1" value="Red Player 1">
                        </div>
                        <div class="form-group" id="red-p2-group">
                            <label for="red-player-2">Player 2 (Pitcher B)</label>
                            <input type="text" id="red-player-2" value="Red Player 2">
                        </div>
                    </div>

                    <!-- Blue Team -->
                    <div class="team-config blue-border-left" id="blue-setup-section">
                        <h3>Blue Team</h3>
                        <div class="form-group">
                            <label for="blue-player-1">Player 1 (Pitcher A)</label>
                            <input type="text" id="blue-player-1" value="Blue Player 1">
                        </div>
                        <div class="form-group" id="blue-p2-group">
                            <label for="blue-player-2">Player 2 (Pitcher B)</label>
                            <input type="text" id="blue-player-2" value="Blue Player 2">
                        </div>
                    </div>
                </div>

                <button class="btn btn-primary btn-block" onclick="startMatch()">Start Match</button>
            </section>
        </div>

        <!-- TAB 2: SCOREKEEPING -->
        <div id="tab-scorekeeping" class="tab-content">
            <!-- Scoreboard Banner -->
            <section class="scoreboard">
                <div class="score-box red-bg">
                    <span id="red-score-label" class="team-label">RED</span>
                    <span id="red-total" class="team-score">0</span>
                </div>
                <div class="score-box blue-bg" id="blue-score-box">
                    <span class="team-label">BLUE</span>
                    <span id="blue-total" class="team-score">0</span>
                </div>
            </section>

            <!-- Current Inning Controls -->
            <section class="card">
                <h2>Inning <span id="display-inn-num">1</span> Throw Input</h2>

                <!-- Red / Practice Pitcher Selection -->
                <div class="team-input-section red-border">
                    <h3 id="red-pitcher-label">RED: PLAYER NAME</h3>
                    
                    <div class="selector-row">
                        <label>Board (1pt)</label>
                        <div id="red-board-boxes" class="btn-box-group"></div>
                    </div>
                    <div class="selector-row">
                        <label>Hole (3pt)</label>
                        <div id="red-hole-boxes" class="btn-box-group"></div>
                    </div>
                </div>

                <!-- Blue Pitcher Selection -->
                <div class="team-input-section blue-border" id="blue-team-section">
                    <h3 id="blue-pitcher-label">BLUE: PLAYER NAME</h3>
                    
                    <div class="selector-row">
                        <label>Board (1pt)</label>
                        <div id="blue-board-boxes" class="btn-box-group"></div>
                    </div>
                    <div class="selector-row">
                        <label>Hole (3pt)</label>
                        <div id="blue-hole-boxes" class="btn-box-group"></div>
                    </div>
                </div>

                <button id="btnEndInning" class="btn btn-primary btn-block" onclick="submitInning()">Submit Inning</button>
            </section>

            <!-- Inning Log Table -->
            <section class="card">
                <h2>Inning Log</h2>
                <div class="table-responsive">
                    <table class="log-table">
                        <thead>
                            <tr>
                                <th>Inn</th>
                                <th>Red Pitcher</th>
                                <th>Red Pts</th>
                                <th class="blue-col">Blue Pitcher</th>
                                <th class="blue-col">Blue Pts</th>
                                <th>Inning Net</th>
                                <th>Match Score</th>
                            </tr>
                        </thead>
                        <tbody id="log-body">
                            <!-- Rows injected via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

        <!-- TAB 3: PLAYER STATS -->
        <div id="tab-stats" class="tab-content">
            <section class="card">
                <h2>Match Player Statistics</h2>
                <div id="stats-container" class="stats-container">
                    <!-- Cards with Avg / Inning injected dynamically via JS -->
                </div>
            </section>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
